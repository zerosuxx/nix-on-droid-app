name: Release Termux API APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Termux:API git tag (e.g. v0.53.0)"
        required: true
        default: "v0.53.0"
        type: string

      termux_shared_version:
        description: "termux-shared JitPack commit/version"
        required: true
        default: "8aca6dbbf4"
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Termux API
        uses: actions/checkout@v7
        with:
          repository: termux/termux-api
          ref: ${{ inputs.version }}
          path: termux-api

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: termux-api/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Patch Termux API
        working-directory: termux-api
        run: |
          set -euxo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          GRADLE="app/build.gradle"

          echo "=== Before patch ==="
          grep -nE \
            'sharedUserId|TERMUX_PACKAGE_NAME|TermuxApiReceiver|exported|termux-shared' \
            "$MANIFEST" "$GRADLE" || true

          # Use Nix-on-Droid as the Termux host package.
          sed -i \
            's/manifestPlaceholders\.TERMUX_PACKAGE_NAME = "com\.termux"/manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux.nix"/' \
            "$GRADLE"

          # Replace the upstream termux-shared commit/hash.
          sed -Ei \
            's|(implementation "com\.termux\.termux-app:termux-shared:)[^"]+(")|\1${{ inputs.termux_shared_version }}\2|' \
            "$GRADLE"

          # Remove upstream custom debug signing config.
          sed -i \
            '/^[[:space:]]*signingConfigs[[:space:]]*{/,/^[[:space:]]*buildTypes[[:space:]]*{/{/^[[:space:]]*buildTypes[[:space:]]*{/!d}' \
            "$GRADLE"

          # Remove shared UID requirement.
          sed -i \
            's/[[:space:]]*android:sharedUserId="${TERMUX_PACKAGE_NAME}"//' \
            "$MANIFEST"

          # Make TermuxApiReceiver externally accessible.
          sed -i \
            '/android:name="\.TermuxApiReceiver"/,/\/>/ s/android:exported="false"/android:exported="true"/' \
            "$MANIFEST"

          # Make KeepAliveService externally startable.
          sed -i \
            '/android:name="\.KeepAliveService"/,/\/>/ s/android:exported="false"/android:exported="true"/' \
            "$MANIFEST"

          echo "=== After patch ==="
          grep -nE \
            'sharedUserId|TERMUX_PACKAGE_NAME|TermuxApiReceiver|exported|termux-shared' \
            "$MANIFEST" "$GRADLE" || true

          echo "=== Manifest ==="
          cat "$MANIFEST"

          echo "=== Gradle ==="
          cat "$GRADLE"

      - name: Build debug APK
        working-directory: termux-api
        run: |
          chmod +x ./gradlew

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          echo "=== Finding generated APK ==="

          APK="$(find termux-api/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            find termux-api/app/build -type f || true
            exit 1
          fi

          echo "Found APK: $APK"

          cp \
            "$APK" \
            "artifacts/termux-api-${{ inputs.version }}-nix.apk"

          echo "=== Artifacts ==="
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-api-${{ inputs.version }}-nix
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
